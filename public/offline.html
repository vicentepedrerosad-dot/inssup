<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>INSSUP · Sin conexión</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1120; color: #e6ebf2; font-family: system-ui, -apple-system, sans-serif; }
      .card { text-align: center; padding: 32px; max-width: 340px; }
      .mark { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 18px; background: linear-gradient(135deg,#2f6be0,#0b3a48); display: grid; place-items: center; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { color: #a3b1c4; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
      button { background: #0e7490; color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round"><path d="M4.9 16.1a10 10 0 0 1 0-8.2M19.1 7.9a10 10 0 0 1 0 8.2M7.8 13.3a5 5 0 0 1 0-2.6M16.2 10.7a5 5 0 0 1 0 2.6"/><circle cx="12" cy="12" r="1.5" fill="#a5f3fc" stroke="none"/></svg>
      </div>
      <h1>Sin conexión</h1>
      <p>No hay internet en este momento. INSSUP necesita conexión para sincronizar con la central. Revisa tu red e inténtalo de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
